    <style>
      /* Pre-hydration paint: no flash of white, no flash of empty canvas. */
      html, body { margin: 0; background: #F7F9FD; color: #0F2A5C; }
      html[data-theme='dark'], html[data-theme='dark'] body { background: #060C1C; color: #F0F4FA; }
    </style>
    <script>
      // Light is the default; only a saved choice of dark switches it before first paint
      try { if (localStorage.getItem('preambl-theme') === 'dark') document.documentElement.dataset.theme = 'dark' } catch (e) {}
    </script>
